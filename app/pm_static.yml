# TF-M storage at the end of flash, matching the factory nuSIM layout:
# ITS 0xF8000-0xFDFFF holds the nuSIM, NV counters 0xFE000-0xFFFFF. Nothing
# at or above 0xF8000 (nor UICR at 0xFF8000) may be erased or in an image.
tfm_its:
  address: 0xf8000
  size: 0x6000
tfm_otp_nv_counters:
  address: 0xfe000
  size: 0x2000
tfm_storage:
  address: 0xf8000
  size: 0x8000
  span: [tfm_its, tfm_otp_nv_counters]
