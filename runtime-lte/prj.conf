# --- nRF9151 / nuSIM LTE ---
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_NRF_MODEM_LIB=y

# --- zbus (required by the monitor's `depends on`) ---
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=192

# --- Runtime security monitor: built-in policies only (no LLEXT/syscall hooks) ---
# Feature set + tunables below are frozen into the blob (README: "Rebuilding the blob").
CONFIG_RUNTIME_MONITOR=y
# platform.exein.io /zephyr/threats accepts only heap_low today; any other
# finding (heap_drop, stack_low, log, ...) gets the whole batch rejected with
# 400 "unsupported finding". Re-enable once the platform takes them.
CONFIG_POLICY_HEAP_LOW=y
CONFIG_POLICY_P2=n
CONFIG_POLICY_STACK_LOW=n
CONFIG_POLICY_LOG=n
CONFIG_THREAD_COLLECT_PERIOD_MS=2000
# Analyzer drains the heap event buffer every second; 5000 ms with a small
# buffer drops FREE events and wedges the HEAP_LOW live-bytes tally.
CONFIG_ANALYZER_PERIOD_MS=1000
CONFIG_MONITOR_EVENT_BUF_SIZE=16384
# The heap listener bridges alloc/free hooks through heap_msgq, drained every
# 500 ms. Default depth 16 silently drops any >16-event burst (Button 2 does
# 24 allocs + 24 frees); a dropped FREE permanently inflates the HEAP_LOW tally.
CONFIG_HEAP_MSGQ_DEPTH=512
# HEAP_LOW threshold: 60% of CONFIG_HEAP_MEM_POOL_SIZE (9831 B of 16 KB).
CONFIG_HEAP_LOW_PCT=60
CONFIG_THREAD_RUNTIME_STATS=y

# --- Exein platform over LTE (runtime_monitor_ncs.conf, modem TLS path) ---
# TLS runs in the modem; CA + client identity live in the modem key store
# (credential backend in main.c). No bootstrap token is built in: it comes
# from the settings page (web flasher or scripts/settings-hex.py).
CONFIG_THREAT_HTTP_DEST_ADDR="platform.exein.io"
CONFIG_THREAT_HTTP_PORT=8003
CONFIG_RUNTIME_MONITOR_REGISTRATION_ADDR="platform.exein.io"
CONFIG_RUNTIME_MONITOR_REGISTRATION_PORT=8004
# AT commands on the log UART (AT%XICCID health check, AT%CMNG to reset the identity).
CONFIG_AT_HOST_LIBRARY=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_RUNTIME_MONITOR_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_MODEM_KEY_MGMT=y
CONFIG_RUNTIME_MONITOR_STACK_OVERFLOW=n
CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y
# The monitor waits for IPv4 via conn_mgr: needs the modem's Zephyr net_if.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
# Wall clock for the monitor (compat/zephyr/sys/clock.h on Zephyr 4.1).
CONFIG_POSIX_TIMERS=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NRF_MODEM_LIB_NET_IF=y
# nuSIM LTE-M attach takes ~30 s; the 30 s default makes the monitor skip
# registration. Read by RUNTIME_ZEPHYR_CONNECTION_INIT (app side, not the blob).
CONFIG_RUNTIME_MONITOR_NET_CONNECT_TIMEOUT=180

# --- Settings page (web flasher or scripts/settings-hex.py; start of the unused MCUboot secondary slot) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# --- Custom id nRF9151-DK_<device id> in SystemInfo (main.c) ---
CONFIG_HWINFO=y

# --- Button 2 triggers the heap burst; LED1 shows LTE state ---
CONFIG_GPIO=y

# --- Resources ---
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=8192

# --- Logging (UART) ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_RUNTIME_MONITOR_LOG_LEVEL_DBG=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# Default 1 KB buffer drops lines at boot (monitor debug hex dumps).
CONFIG_LOG_BUFFER_SIZE=8192
