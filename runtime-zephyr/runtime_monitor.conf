# Exein Runtime Security Monitor — integrator config fragment (blob delivery).
#
# Merge into your application build:
#   west build -b <board> <app> -- -DEXTRA_CONF_FILE=/abs/path/runtime_monitor.conf
#
# The precompiled libruntime_zephyr.a freezes the monitor's features and
# tunables. This fragment carries what YOUR build compiles or links around
# it; RUNTIME_MONITOR `select`s its y-only deps (zbus, logging, networking,
# nanopb). It sets only what the monitor itself needs, so it is the same for
# every delivery; your own choices (IPv6, ITS provider, syscall hooks,
# core/FPU, ...) stay in your prj.conf and must match what you told Exein,
# since the blob is built with them. Keep the "Required" blocks as they are
# and set the items at the bottom. One assignment per line, nothing after the
# value.
#
# West workspace: Zephyr at the revision the blob was built on, plus the
# nanopb, mbedtls and tf-psa-crypto modules (the module's build stops if one
# is missing).

# --- Required: the monitor ----------------------------------------------------
CONFIG_RUNTIME_MONITOR=y

# --- Required: zbus alert transport (zbus is compiled in your build) ----------
# Static pool: a k_malloc'd one would feed the heap monitor its own events.
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8
# >= the largest alert (THREAT_SYSCALL ~156 B); smaller truncates silently.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=192

# --- Required: TLS to the platform (mbedTLS is compiled in your build) --------
# Registration and mutual TLS (ADR-010). The platform CA is RSA-2048/SHA-256
# and client identities may be EC, so both key-exchange families stay on.
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=3
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_384=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_PK_PARSE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_HASH_ALL_ENABLED=y
# Software ECDHE/ECDSA on a Cortex-M needs more than the 10 s default.
CONFIG_NET_SOCKETS_TLS_CONNECT_TIMEOUT=60000
# Two contexts in use (persistent threat POST + LLEXT GET), each with two
# MAX_CONTENT_LEN record buffers. Raise the heap if your app uses TLS too.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192

# --- Required: stack (ADR-010 D7) ---------------------------------------------
# The thread calling runtime_zephyr_start() runs the /register TLS handshake,
# the ITS reads and writes and, with hooks, the LLEXT load; this is for main.
CONFIG_MAIN_STACK_SIZE=12288

# --- Recommended (override to taste) ------------------------------------------
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

# =============================================================================
# YOU MUST ALSO SET THESE (per board/app, no safe default)
# =============================================================================
#
# 1. Platform connection (ADR-010 D9). Read in YOUR build by
#    RUNTIME_ZEPHYR_CONNECTION_INIT and passed to runtime_zephyr_start(), so
#    the library does not freeze them. Empty registration address = telemetry
#    host; registration port defaults to the telemetry port; empty token = no
#    registration (keep the token in an untracked conf file):
#      CONFIG_THREAT_HTTP_DEST_ADDR="platform.example"
#      CONFIG_THREAT_HTTP_PORT=8003
#      CONFIG_RUNTIME_MONITOR_REGISTRATION_ADDR="platform.example"
#      CONFIG_RUNTIME_MONITOR_REGISTRATION_PORT=8004
#      CONFIG_RUNTIME_MONITOR_BOOTSTRAP_TOKEN="<token>"
#    The platform CA certificate is inside the blob.
#
# 2. Network: bring your interface up and get IPv4 (Ethernet, Wi-Fi,
#    cellular, ...); the monitor only waits for it. Any L2 works. Keep
#    CONFIG_NET_IPV6 as you told Exein (the blob is built with it).
#
# 3. ITS provider for the credential store (ADR-010 D1), REQUIRED: the build
#    stops without one. It must be the one you told Exein. Zephyr secure
#    storage (EXPERIMENTAL), an entry holding one PEM credential, with a store
#    backend, e.g. ZMS on a dedicated partition exposed as chosen
#    `secure_storage_its_partition`:
#      CONFIG_SECURE_STORAGE=y
#      CONFIG_SECURE_STORAGE_ITS_MAX_DATA_SIZE=2048
#      CONFIG_SECURE_STORAGE_ITS_STORE_IMPLEMENTATION_ZMS=y
#      CONFIG_FLASH=y
#      CONFIG_ZMS=y
#      CONFIG_SECURE_STORAGE_ITS_STORE_ZMS_SECTOR_SIZE=8192
#    Keep the firmware image out of that partition: link it into its own
#    (chosen `zephyr,code-partition`) with the line below, or an image grown
#    into it would overwrite the device identity when flashed.
#      CONFIG_USE_DT_CODE_PARTITION=y
#    The ZMS sector must exceed twice the ITS entry size. Your own store
#    instead: CONFIG_SECURE_STORAGE_ITS_IMPLEMENTATION_CUSTOM=y and implement
#    the four secure_storage_its_* functions. ITS UIDs 0x3E5E1000..0x3E5E1002
#    belong to the monitor. TF-M targets instead (their blob is built for
#    TF-M): CONFIG_BUILD_WITH_TFM=y and
#    CONFIG_TFM_PARTITION_INTERNAL_TRUSTED_STORAGE=y.
#
# 4. Entropy for TLS and the ITS AEAD transform: a hardware RNG, e.g.
#      CONFIG_ENTROPY_GENERATOR=y
#    Never CONFIG_TEST_RANDOM_GENERATOR outside QEMU: it is not random.
#
# 5. Syscall hooks (ADR-004), off by default. Only if your blob was built
#    with them (you told Exein), turn them on; the value must match the blob
#    (a mismatch fails the link on __wrap_* or llext_* symbols):
#      CONFIG_RUNTIME_MONITOR_SYSCALL_HOOKS=y
#    They need an LLEXT heap for the hook module the monitor downloads at
#    boot. The module runs from it, so on MPU targets it must be executable
#    RAM (e.g. chosen `zephyr,llext-heap` on a non-XN region):
#      CONFIG_LLEXT_HEAP_DYNAMIC=n
#      CONFIG_LLEXT_HEAP_SIZE=8
#    With CONFIG_USERSPACE, add its text partition to the hooked threads'
#    memory domain: za_llext_add_text_to_domain().
#
# 6. System heap the monitor watches (k_malloc pool, 0 = nothing to watch):
#      CONFIG_HEAP_MEM_POOL_SIZE=<bytes>
#
# 7. Only if your blob was built with hooks and LLEXT flash persistence
#    (Exein tells you): CONFIG_FLASH=y, CONFIG_FLASH_MAP=y and the same
#    `storage_partition` layout the blob was built against (its partition ID
#    is baked in).
